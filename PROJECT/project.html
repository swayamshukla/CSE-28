<!-- crete a webpage of fastrack website page using css for style text ,colors,fonts,margin,border,padding,width and height --> -->
 <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fastrack Website</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f0f0f0;
            }
            .header {
                background-color: #000;
                color: #fff;
                padding: 15px 0;
                text-align: center;
            }
            .header h1 {
                margin: 0;
                font-size: 36px;
            }
            .nav {
                background-color: #333;
                overflow: hidden;
            }
            .nav a {
                float: left;
                display: block;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }
            .nav a:hover {
                background-color: #ddd;
                color: black;
            }
            .content {
                padding: 20px;
            }
            .content h2 {
                color: #333;
            }
            .content p {
                font-size: 18px;
                line-height: 1.6;
                color: #666;
            }
            .footer {
                background-color: #000;
                color: #fff;
                text-align: center;
                padding: 10px 0;
                position: fixed;
                width: 100%;
                bottom: 0;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Fastrack Website</h1>
        </div>
        <div class="nav">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
        <div class="content">
            <h2>Welcome to Fastrack</h2>
            <p>Your one-stop shop for trendy watches and accessories.</p>
        </div>
        <div class="footer">
            &copy; 2024 Fastrack. All rights reserved.
        </div>
    </body>
